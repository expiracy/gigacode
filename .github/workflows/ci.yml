name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Expected package version for a release rehearsal
        type: string
        required: false
        default: ''
    outputs:
      artifact-name:
        value: ${{ jobs.artifact.outputs.artifact-name }}
      filename:
        value: ${{ jobs.artifact.outputs.filename }}
      version:
        value: ${{ jobs.artifact.outputs.version }}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, tests and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Lint GitHub workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test --timeout 15000

  artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: npm-package-${{ github.sha }}-${{ github.run_attempt }}
      filename: ${{ steps.manifest.outputs.filename }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Pack once and bind artifact to source
        id: manifest
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(bun -p 'require("./package.json").version')"
          bun run scripts/release-artifact.ts prepare "$RUNNER_TEMP/release" "${EXPECTED_VERSION:-$version}"
          bun run scripts/release-artifact.ts verify "$RUNNER_TEMP/release" "${EXPECTED_VERSION:-$version}" "$GITHUB_SHA"
          bun -e 'const r = await Bun.file(process.env.RUNNER_TEMP + "/release/release.json").json(); await Bun.write(process.env.GITHUB_OUTPUT, `filename=${r.filename}\nversion=${r.version}\n`); await Bun.write(process.env.GITHUB_STEP_SUMMARY, `### Package candidate\n\nVersion: ${r.version}\n\nCommit: ${r.commit}\n\nIntegrity: ${r.integrity}\n`);'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  package:
    name: Package (${{ matrix.os }})
    needs: artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify downloaded artifact
        env:
          EXPECTED_VERSION: ${{ needs.artifact.outputs.version }}
        run: bun run scripts/release-artifact.ts verify "${{ runner.temp }}/release" "$env:EXPECTED_VERSION" "$env:GITHUB_SHA"
        if: runner.os == 'Windows'
      - name: Verify downloaded artifact
        env:
          EXPECTED_VERSION: ${{ needs.artifact.outputs.version }}
        run: bun run scripts/release-artifact.ts verify "$RUNNER_TEMP/release" "$EXPECTED_VERSION" "$GITHUB_SHA"
        if: runner.os != 'Windows'
      - name: Exercise installed package lifecycle
        run: bun run scripts/check-package.ts --artifact "${{ runner.temp }}/release/${{ needs.artifact.outputs.filename }}"

  native:
    name: Native OpenCode ${{ matrix.host }}
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        host: [2.0.25, 2.0.26, 2.0.28]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify downloaded artifact
        env:
          EXPECTED_VERSION: ${{ needs.artifact.outputs.version }}
        run: bun run scripts/release-artifact.ts verify "$RUNNER_TEMP/release" "$EXPECTED_VERSION" "$GITHUB_SHA"
      - name: Install selected official native host
        env:
          HOST_VERSION: ${{ matrix.host }}
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-host" --no-audit --no-fund "@opencode/cli@$HOST_VERSION"
          test -x "$RUNNER_TEMP/opencode-host/node_modules/@opencode/cli/bin/opencode.exe"
          test "$("$RUNNER_TEMP/opencode-host/node_modules/@opencode/cli/bin/opencode.exe" --version)" = "$HOST_VERSION"
      - name: Run scripted native integration
        shell: bash
        run: bun run test:integration 2>&1 | tee "$RUNNER_TEMP/native-check.log"
        env:
          OPENCODE_TEST_VERSION: ${{ matrix.host }}
          OPENCODE_SPIKE_BIN: ${{ runner.temp }}/opencode-host/node_modules/@opencode/cli/bin/opencode.exe
          GIGACODE_TEST_ARTIFACT: ${{ runner.temp }}/release/${{ needs.artifact.outputs.filename }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.host }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-check.log
            .spike/integration-*/integration.json
          if-no-files-found: ignore
          retention-days: 7

  parallel:
    name: Isolated parallel writers
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify downloaded artifact
        env:
          EXPECTED_VERSION: ${{ needs.artifact.outputs.version }}
        run: bun run scripts/release-artifact.ts verify "$RUNNER_TEMP/release" "$EXPECTED_VERSION" "$GITHUB_SHA"
      - run: npm install --prefix "$RUNNER_TEMP/opencode-host" --no-audit --no-fund @opencode/cli@2.0.28
      - name: Run isolated parallel integration
        shell: bash
        run: bun run test:parallel 2>&1 | tee "$RUNNER_TEMP/parallel-check.log"
        env:
          OPENCODE_TEST_VERSION: 2.0.28
          OPENCODE_SPIKE_BIN: ${{ runner.temp }}/opencode-host/node_modules/@opencode/cli/bin/opencode.exe
          GIGACODE_TEST_ARTIFACT: ${{ runner.temp }}/release/${{ needs.artifact.outputs.filename }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parallel-2.0.28-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/parallel-check.log
            .spike/parallel-*/audit.json
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI
    if: always()
    needs: [checks, artifact, package, native, parallel]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = 'success success success success success'
