name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Rehearse locally, or create a draft GitHub release from the tested artifact
        type: choice
        required: true
        default: rehearsal
        options:
          - rehearsal
          - draft

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate GitHub release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate delivery and read the exact candidate version
        id: candidate
        env:
          DELIVERY: ${{ inputs.delivery }}
        run: |
          case "$DELIVERY" in
            rehearsal) ;;
            draft)
              test "$GITHUB_REPOSITORY" = expiracy/gigacode
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_REF_PROTECTED" = true
              ;;
            *) exit 1 ;;
          esac
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (typeof version !== "string" || !/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error("Invalid package version");
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

  checks:
    name: GitHub release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read

  rehearsal:
    name: Rehearse GitHub release
    if: inputs.delivery == 'rehearsal'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Generate and verify local release evidence
        env:
          GITHUB_RELEASE_DELIVERY: ${{ inputs.delivery }}
        run: node scripts/github-release.mjs rehearsal --directory "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --diagnostics "$RUNNER_TEMP/github-release-diagnostics"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: github-release-rehearsal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-release-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  draft:
    name: Prepare draft GitHub release
    if: inputs.delivery == 'draft' && github.repository == 'expiracy/gigacode' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Create or complete the verified draft
        env:
          GITHUB_RELEASE_DELIVERY: ${{ inputs.delivery }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs draft --directory "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --diagnostics "$RUNNER_TEMP/github-release-diagnostics"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: github-release-draft-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-release-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
