name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Rehearse by default; publish waits for npm-production approval
        type: choice
        options: [rehearsal, publish]
        default: rehearsal
        required: true
      version:
        description: Exact package version on main (for example 0.1.0)
        type: string
        required: true
      channel:
        description: package keeps its tag; latest makes this version the default npm install
        type: choice
        options: [package, latest]
        default: package
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Check exact version and protected source for publication
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DELIVERY: ${{ inputs.delivery }}
          PUBLICATION_CHANNEL: ${{ inputs.channel }}
        run: |
          case "$PUBLICATION_CHANNEL" in package|latest) ;; *) exit 1 ;; esac
          bun -e 'const p = await Bun.file("package.json").json(); if (p.version !== process.env.EXPECTED_VERSION) throw new Error("Publication input must match package.json exactly");'
          if [ "$DELIVERY" = publish ]; then
            test "$GITHUB_REPOSITORY" = expiracy/gigacode
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_REF_PROTECTED" = true
            test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
            test "$(git rev-parse --verify "refs/tags/v${EXPECTED_VERSION}^{commit}")" = "$GITHUB_SHA"
          fi

  checks:
    name: Publication checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read

  review:
    name: Review tested npm artifact
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Rehearse the exact tested artifact without npm authentication
        env:
          PUBLICATION_CHANNEL: ${{ inputs.channel }}
        run: node scripts/publish-artifact.mjs rehearsal --channel "$PUBLICATION_CHANNEL" --directory "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --diagnostics "$RUNNER_TEMP/npm-publish-review"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-publish-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-publish-review/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish approved tested npm artifact
    if: inputs.delivery == 'publish'
    needs: [checks, review]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install pinned OIDC-capable npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Recheck protected main after human approval
        run: |
          test "$GITHUB_REPOSITORY" = expiracy/gigacode
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Publish exact tested archive with OIDC and provenance
        env:
          GIGACODE_PUBLISH_ACTION: ${{ inputs.delivery }}
          GIGACODE_PUBLISH_ENVIRONMENT: npm-production
          PUBLICATION_CHANNEL: ${{ inputs.channel }}
        run: node scripts/publish-artifact.mjs publish --channel "$PUBLICATION_CHANNEL" --directory "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --diagnostics "$RUNNER_TEMP/npm-publish-receipt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-publish-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-publish-receipt/
          if-no-files-found: ignore
          retention-days: 30
