name: Prepare npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version on main (for example 0.1.0-beta.1)
        type: string
        required: true
      stage:
        description: Submit tested tarball to npm staging (requires configured trusted publisher)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Require main and exact candidate version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bun -e 'const p = await Bun.file("package.json").json(); if (p.version !== process.env.EXPECTED_VERSION) throw new Error("Release input must match package.json exactly");'

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read

  stage:
    name: Stage verified npm tarball
    if: inputs.stage
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install pinned staging-capable npm
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Recheck source and exact artifact
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bun run scripts/release-artifact.ts verify "$RUNNER_TEMP/release" "$EXPECTED_VERSION" "$GITHUB_SHA"
      - name: Submit to npm staging with OIDC
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/release/${{ needs.checks.outputs.filename }}
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm stage publish "$ARTIFACT_PATH" --tag next --access public --ignore-scripts --json --registry https://registry.npmjs.org/ > "$RUNNER_TEMP/staging-receipt.json"
      - name: Record staging receipt
        run: |
          # The template expressions belong to JavaScript, not the shell.
          # shellcheck disable=SC2016
          bun -e 'const data = await Bun.file(process.env.RUNNER_TEMP + "/staging-receipt.json").json(); const p = data["opencode-gigacode"]; if (!p?.stageId) throw new Error("npm returned no staging receipt"); await Bun.write(process.env.GITHUB_STEP_SUMMARY, `### Awaiting npm approval\n\n${p.id} staged under next. Stage ID: ${p.stageId}\n\nA maintainer must approve it with 2FA on npm. CI does not approve or publish it.\n`);'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-staging-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-receipt.json
          if-no-files-found: ignore
          retention-days: 30
